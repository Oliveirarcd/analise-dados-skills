name: testes

on:
  push:
  pull_request:

jobs:
  testes:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Testes
        run: python -m pytest
      - name: Validação do repositório
        run: python ferramentas/validar_skills.py
